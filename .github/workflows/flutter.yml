name: Flutter CI

on:
  push:
    branches: [main]
    tags: ['v*']

  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Verify Java Version
        run: java -version

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Run Widget Tests
        run: flutter test

      - name: Validate Release API URL
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL }}
        run: |
          case "$API_BASE_URL" in
            https://* )
              ;;
            *)
              echo "::error::Set the GitHub Actions repository variable API_BASE_URL to the production HTTPS API URL before a v* release."
              exit 1
              ;;
          esac

      - name: Build APK
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL || 'https://setorin.my.id/api' }}
        run: |
          flutter build apk \
            --release \
            --split-per-abi \
            --dart-define="API_BASE_URL=$API_BASE_URL"

      - name: Check APK Size
        run: |
          ls -lh build/app/outputs/flutter-apk/
          echo "Telegram limit: 50 MB per file"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/*.apk

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ github.ref_name }}
          files: build/app/outputs/flutter-apk/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Check Optional Telegram Configuration
        id: telegram_config
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -n "$TELEGRAM_BOT_TOKEN" ] && [ -n "$TELEGRAM_CHAT_ID" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Telegram delivery skipped; configure TELEGRAM_BOT_TOKEN and TELEGRAM_CHAT_ID to enable it."
          fi

      - name: Send APK to Telegram
        if: startsWith(github.ref, 'refs/tags/v') && steps.telegram_config.outputs.configured == 'true'
        uses: appleboy/telegram-action@v1.0.1
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          document: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          message: |
            APK Setor.in
            Build: ${{ github.sha }}
            Branch: ${{ github.ref_name }}
            Arsitektur: arm64-v8a